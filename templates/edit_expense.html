{% extends "layout.html" %}

{% block content %}
<div class="page-header">
    <div>
        <div class="page-header-eyebrow">
            <div class="page-header-eyebrow-line"></div>
            <span class="page-header-eyebrow-text">Financial Accounting</span>
        </div>
        <h1>Edit Operating <span class="gold">Expense</span></h1>
        <p class="page-header-sub">Update date, category, description, or expenditure amount.</p>
    </div>
    <a href="/expenses" class="btn btn-outline-secondary btn-sm">
        <i class="bi bi-arrow-left me-1"></i>Back to Expenses
    </a>
</div>

<div class="row justify-content-center">
    <div class="col-md-6 col-lg-5">
        <div class="card">
            <div class="card-header">Expense Details</div>
            <div class="card-body">
                <form action="/edit_expense/{{ expense.id }}" method="POST">
                    <div class="mb-3">
                        <label class="form-label">Date</label>
                        <input type="date" name="date" class="form-control" value="{{ expense.date.strftime('%Y-%m-%d') if expense.date else '' }}" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Description</label>
                        <input type="text" name="description" class="form-control" value="{{ expense.description }}" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Category</label>
                        <select name="category" class="form-select" required>
                            <option value="Marketing" {% if expense.category == 'Marketing' %}selected{% endif %}>Marketing / Ads</option>
                            <option value="Packaging" {% if expense.category == 'Packaging' %}selected{% endif %}>Packaging</option>
                            <option value="Delivery" {% if expense.category == 'Delivery' %}selected{% endif %}>Delivery Fees</option>
                            <option value="Rent" {% if expense.category == 'Rent' %}selected{% endif %}>Rent / Utilities</option>
                            <option value="Other" {% if expense.category == 'Other' %}selected{% endif %}>Other</option>
                        </select>
                    </div>
                    <div class="mb-4">
                        <label class="form-label">Amount (Rs)</label>
                        <input type="number" step="0.01" name="amount" class="form-control" value="{{ expense.amount }}" required>
                    </div>
                    <div class="d-grid gap-2">
                        <button type="submit" class="btn btn-warning fw-bold">
                            <i class="bi bi-check-lg me-1"></i>Update Expense
                        </button>
                        <a href="/expenses" class="btn btn-outline-secondary">Cancel</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
