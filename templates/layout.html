<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Saluza's Closet — Manager</title>
    <meta name="description" content="Saluza's Closet Order Management System.">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;0,700;1,400;1,600&family=Inter:wght@300;400;500;600;700&family=Oswald:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <style>
        /* ══════════════════════════════════════════
           LUXURY LIGHT THEME DESIGN SYSTEM
        ══════════════════════════════════════════ */
        :root {
            /* Warm Rich Gold Accent for Light Mode */
            --gold:          #A17A1F;
            --gold-light:    #C49B28;
            --gold-muted:    #8C6B18;
            --gold-tint:     rgba(161, 122, 31, 0.12);
            --gold-tint-sm:  rgba(161, 122, 31, 0.06);

            /* Soothing Soft Light Backgrounds */
            --bg:         #F8FAFC;
            --bg-2:       #FFFFFF;
            --surface:    #FFFFFF;
            --surface-2:  #F1F5F9;
            --surface-3:  #E2E8F0;
            --surface-4:  #CBD5E1;

            /* High Legibility Dark Slate Typography & Contrast */
            --text:          #0F172A;
            --text-secondary:#475569;
            --text-tertiary: #64748B;

            /* Light Theme Borders */
            --line:          rgba(161, 122, 31, 0.28);
            --line-soft:     #E2E8F0;
            --line-strong:   rgba(161, 122, 31, 0.50);

            /* Clear Status Colors for Light Background */
            --success:       #16A34A;
            --success-dark:  #15803D;
            --success-tint:  rgba(22, 163, 74, 0.10);
            --danger:        #DC2626;
            --danger-dark:   #991B1B;
            --danger-tint:   rgba(220, 38, 38, 0.10);
            --warning:       #D97706;
            --warning-tint:  rgba(217, 119, 6, 0.10);
            --info:          #0284C7;
            --info-tint:     rgba(2, 132, 199, 0.10);

            /* Radii & Shadows */
            --r-sm:   8px;
            --r-md:   12px;
            --r-lg:   16px;
            --r-xl:   22px;

            --shadow-sm: 0 1px 4px rgba(15, 23, 42, 0.06);
            --shadow-md: 0 4px 16px rgba(15, 23, 42, 0.08);
            --shadow-lg: 0 12px 36px rgba(15, 23, 42, 0.12);

            /* Sidebar */
            --sidebar-w: 250px;
            --ease: cubic-bezier(0.25, 0.1, 0.25, 1);

            /* ── BOOTSTRAP 5 CSS VARIABLE OVERRIDES ── */
            --bs-body-bg: #F8FAFC;
            --bs-body-color: #0F172A;
            --bs-heading-color: #0F172A;
            --bs-border-color: #E2E8F0;
            --bs-border-color-translucent: rgba(0, 0, 0, 0.08);
            --bs-tertiary-bg: #F1F5F9;
            --bs-secondary-bg: #FFFFFF;

            --bs-table-bg: transparent;
            --bs-table-color: #0F172A;
            --bs-table-border-color: #E2E8F0;
            --bs-table-hover-bg: rgba(161, 122, 31, 0.06);
            --bs-table-hover-color: #0F172A;
            --bs-table-striped-bg: rgba(241, 245, 249, 0.5);
            --bs-table-striped-color: #0F172A;
            --bs-table-active-bg: rgba(161, 122, 31, 0.10);
            --bs-table-active-color: #0F172A;
        }

        /* ── RESET & BASE ── */
        *, *::before, *::after {
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            box-sizing: border-box;
        }
        html { scroll-behavior: smooth; }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background-color: var(--bg) !important;
            color: var(--text) !important;
            font-size: 15.5px;
            line-height: 1.6;
            min-height: 100vh;
            display: flex;
        }

        h1, h2, h3, h4, h5, h6 {
            font-family: 'Oswald', sans-serif;
            font-weight: 600;
            letter-spacing: 0.04em;
            text-transform: uppercase;
            color: var(--text);
            margin-bottom: 0;
        }

        a { color: var(--gold); text-decoration: none; transition: color 0.2s; }
        a:hover { color: var(--gold-light); }
        strong { font-weight: 600; color: var(--text); }
        small, .text-muted { color: var(--text-secondary) !important; font-size: 0.88rem !important; }

        /* ── SCROLLBAR ── */
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: #F1F5F9; }
        ::-webkit-scrollbar-thumb { background: #CBD5E1; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--gold); }

        /* ── PAGE ANIMATION ── */
        @keyframes pageIn {
            from { opacity: 0; transform: translateY(10px); }
            to   { opacity: 1; transform: translateY(0); }
        }
        .page-content { animation: pageIn 0.4s var(--ease) both; }

        @media (prefers-reduced-motion: reduce) {
            html { scroll-behavior: auto; }
            .page-content { animation: none !important; }
        }

        /* ══════════════════════════════════════════
           SIDEBAR
        ══════════════════════════════════════════ */
        .sidebar {
            width: var(--sidebar-w);
            min-height: 100vh;
            background: #FFFFFF;
            border-right: 1px solid var(--line-soft);
            box-shadow: var(--shadow-sm);
            display: flex;
            flex-direction: column;
            position: fixed;
            top: 0; left: 0;
            z-index: 100;
            transition: transform 0.3s var(--ease);
        }

        .sidebar-brand {
            padding: 1.75rem 1.5rem 1.5rem;
            border-bottom: 1px solid var(--line-soft);
            text-decoration: none;
            display: block;
        }
        .sidebar-eyebrow {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            margin-bottom: 0.4rem;
        }
        .sidebar-eyebrow-line {
            height: 1px; width: 22px;
            background: var(--gold); flex-shrink: 0;
        }
        .sidebar-eyebrow-text {
            font-family: 'Inter', sans-serif;
            font-size: 0.72rem; font-weight: 700;
            color: var(--gold); letter-spacing: 0.2em;
            text-transform: uppercase;
        }
        .sidebar-brand-name {
            font-family: 'Oswald', sans-serif;
            font-size: 1.45rem; font-weight: 700;
            letter-spacing: 0.12em; text-transform: uppercase;
            color: var(--text); line-height: 1; display: block;
        }
        .sidebar-brand-name span { color: var(--gold); }
        .sidebar-brand-sub {
            font-family: 'Inter', sans-serif;
            font-size: 0.72rem; font-weight: 500;
            color: var(--text-tertiary); letter-spacing: 0.15em;
            text-transform: uppercase; display: block; margin-top: 0.25rem;
        }

        .sidebar-nav {
            flex: 1; padding: 1.25rem 1.1rem;
            display: flex; flex-direction: column; gap: 4px;
        }
        .sidebar-nav-label {
            font-family: 'Inter', sans-serif;
            font-size: 0.72rem; font-weight: 700;
            color: var(--text-tertiary); text-transform: uppercase;
            letter-spacing: 0.18em; padding: 0.9rem 0.6rem 0.4rem;
        }

        .sidebar-link {
            display: flex; align-items: center; gap: 0.8rem;
            padding: 0.7rem 0.85rem; border-radius: var(--r-sm);
            font-family: 'Inter', sans-serif;
            font-size: 0.92rem; font-weight: 500;
            color: var(--text-secondary); text-decoration: none;
            transition: background 0.2s, color 0.2s, border-color 0.2s;
            border-left: 3px solid transparent; letter-spacing: 0.02em;
        }
        .sidebar-link i { font-size: 1.05rem; width: 1.2rem; text-align: center; flex-shrink: 0; }
        .sidebar-link:hover {
            background: var(--surface-2); color: var(--text);
            border-left-color: var(--gold-muted);
        }
        .sidebar-link.active {
            background: var(--gold-tint); color: var(--gold);
            border-left-color: var(--gold); font-weight: 600;
        }

        .sidebar-footer { padding: 1.1rem 1.25rem; border-top: 1px solid var(--line-soft); }
        .sidebar-status {
            display: flex; align-items: center; gap: 0.6rem;
            font-family: 'Inter', sans-serif; font-size: 0.8rem;
            color: var(--text-tertiary); letter-spacing: 0.04em;
        }
        .status-dot {
            width: 7px; height: 7px; border-radius: 50%;
            background: var(--success); animation: statusPulse 2.5s ease infinite;
        }
        @keyframes statusPulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }

        /* ── MOBILE TOP BAR ── */
        .topbar {
            display: none; position: fixed; top: 0; left: 0; right: 0;
            height: 60px; background: rgba(255, 255, 255, 0.96);
            backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
            border-bottom: 1px solid var(--line-soft); z-index: 200;
            padding: 0 1.25rem; align-items: center; justify-content: space-between;
        }
        .topbar-brand {
            font-family: 'Oswald', sans-serif; font-size: 1.15rem;
            font-weight: 600; letter-spacing: 0.1em;
            text-transform: uppercase; color: var(--text);
        }
        .topbar-brand span { color: var(--gold); }
        .hamburger-btn {
            background: none; border: none; color: var(--text-secondary);
            font-size: 1.3rem; padding: 0.25rem; cursor: pointer;
        }
        .sidebar-overlay {
            display: none; position: fixed; inset: 0;
            background: rgba(15, 23, 42, 0.4); z-index: 99;
        }
        .sidebar-overlay.active { display: block; }

        .main-wrapper { margin-left: var(--sidebar-w); flex: 1; min-height: 100vh; }
        .main-content { padding: 2.5rem 2.25rem; max-width: 1550px; width: 100%; }

        @media (max-width: 768px) {
            .sidebar { transform: translateX(-100%); }
            .sidebar.open { transform: translateX(0); box-shadow: var(--shadow-lg); }
            .topbar { display: flex; }
            .main-wrapper { margin-left: 0; padding-top: 60px; }
            .main-content { padding: 1.5rem 1rem; }
        }

        /* ══════════════════════════════════════════
           PAGE HEADER
        ══════════════════════════════════════════ */
        .page-header {
            display: flex; justify-content: space-between; align-items: flex-start;
            flex-wrap: wrap; gap: 1rem; padding-bottom: 1.75rem; margin-bottom: 2rem;
            border-bottom: 1px solid var(--line-soft); position: relative;
        }
        .page-header::before {
            content: ''; position: absolute; bottom: -1px; left: 0;
            width: 70px; height: 2px; background: var(--gold);
        }
        .page-header-eyebrow { display: flex; align-items: center; gap: 0.5rem; margin-bottom: 0.45rem; }
        .page-header-eyebrow-line { height: 1px; width: 22px; background: var(--gold); flex-shrink: 0; }
        .page-header-eyebrow-text {
            font-size: 0.75rem; font-weight: 700; color: var(--gold);
            letter-spacing: 0.2em; text-transform: uppercase;
        }
        .page-header h1 { font-size: 1.9rem; line-height: 1.1; margin-bottom: 0; color: var(--text); }
        .page-header h1 .gold { color: var(--gold); }
        .page-header-sub {
            font-family: 'Inter', sans-serif; font-size: 0.88rem;
            color: var(--text-secondary); font-weight: 400; font-style: italic;
            margin-top: 0.35rem; letter-spacing: 0; text-transform: none;
        }

        .section-divider { display: flex; align-items: center; gap: 0.75rem; margin-bottom: 1.25rem; }
        .section-divider-line { height: 1px; width: 24px; background: var(--gold); }
        .section-divider-text {
            font-family: 'Oswald', sans-serif; font-size: 0.78rem;
            font-weight: 600; letter-spacing: 0.2em; text-transform: uppercase; color: var(--gold);
        }

        /* ══════════════════════════════════════════
           CARDS
        ══════════════════════════════════════════ */
        .card {
            background: #FFFFFF !important;
            border: 1px solid var(--line-soft) !important;
            border-radius: var(--r-lg) !important;
            box-shadow: var(--shadow-sm);
            transition: border-color 0.25s, box-shadow 0.25s;
        }
        .card:hover { border-color: var(--line) !important; box-shadow: var(--shadow-md); }
        .card-header {
            background: #F8FAFC !important;
            border-bottom: 1px solid var(--line-soft) !important;
            padding: 1.1rem 1.35rem;
            font-family: 'Oswald', sans-serif;
            font-size: 0.85rem; font-weight: 600;
            letter-spacing: 0.15em; text-transform: uppercase;
            color: var(--gold) !important;
            border-radius: var(--r-lg) var(--r-lg) 0 0 !important;
            display: flex; align-items: center;
        }
        .card-body { padding: 1.35rem; }

        /* Stat Cards */
        .stat-card {
            background: #FFFFFF;
            border: 1px solid var(--line-soft);
            border-radius: var(--r-lg);
            padding: 1.5rem;
            box-shadow: var(--shadow-sm);
            position: relative; overflow: hidden;
            transition: border-color 0.3s, box-shadow 0.3s, transform 0.3s;
        }
        .stat-card::after {
            content: ''; position: absolute; bottom: 0; left: 0; right: 0;
            height: 3px; background: var(--card-gold, var(--gold)); opacity: 0.8; transition: opacity 0.3s;
        }
        .stat-card:hover { border-color: var(--line); box-shadow: var(--shadow-md); transform: translateY(-2px); }
        .stat-label {
            font-family: 'Inter', sans-serif; font-size: 0.75rem;
            font-weight: 700; color: var(--text-tertiary);
            text-transform: uppercase; letter-spacing: 0.18em; margin-bottom: 0.5rem;
        }
        .stat-value {
            font-family: 'Oswald', sans-serif; font-size: 1.9rem;
            font-weight: 600; letter-spacing: 0.02em; color: var(--text); line-height: 1.1;
        }
        .stat-value.gold { color: var(--gold); }
        .stat-sub { font-family: 'Inter', sans-serif; font-size: 0.82rem; color: var(--text-secondary); margin-top: 0.5rem; }
        .stat-gold-line { height: 2px; width: 32px; background: var(--gold); margin: 0.65rem 0; }

        /* ══════════════════════════════════════════
           BUTTONS
        ══════════════════════════════════════════ */
        .btn {
            font-family: 'Inter', sans-serif; font-weight: 600;
            font-size: 0.82rem; letter-spacing: 0.08em; text-transform: uppercase;
            padding: 0.65rem 1.35rem; border-radius: var(--r-sm); border-width: 1px;
            transition: all 0.2s var(--ease);
        }
        .btn:active { transform: scale(0.97); }
        .btn-sm { padding: 0.45rem 0.95rem; font-size: 0.75rem; }
        .btn-lg { padding: 0.85rem 1.9rem; font-size: 0.92rem; }

        .btn-primary { background: var(--gold); border-color: var(--gold); color: #FFFFFF; }
        .btn-primary:hover { background: var(--gold-light); border-color: var(--gold-light); color: #FFFFFF; box-shadow: 0 4px 14px rgba(161,122,31,0.3); }
        .btn-outline-primary { background: transparent; border-color: var(--gold); color: var(--gold); }
        .btn-outline-primary:hover { background: var(--gold-tint); border-color: var(--gold); color: var(--gold-light); }

        .btn-success { background: var(--success); border-color: var(--success); color: #fff; }
        .btn-success:hover { background: var(--success-dark); border-color: var(--success-dark); color: #fff; }
        .btn-outline-success { background: transparent; border-color: var(--success); color: var(--success); }
        .btn-outline-success:hover { background: var(--success-tint); border-color: var(--success); color: var(--success); }

        .btn-warning { background: var(--warning); border-color: var(--warning); color: #fff; }
        .btn-warning:hover { background: #B45309; border-color: #B45309; color: #fff; }
        .btn-outline-warning { background: transparent; border-color: var(--warning); color: var(--warning); }
        .btn-outline-warning:hover { background: var(--warning-tint); border-color: var(--warning); color: var(--warning); }

        .btn-danger { background: var(--danger); border-color: var(--danger); color: #fff; }
        .btn-danger:hover { background: var(--danger-dark); border-color: var(--danger-dark); color: #fff; }
        .btn-outline-danger { background: transparent; border-color: var(--danger); color: var(--danger); }
        .btn-outline-danger:hover { background: var(--danger-tint); border-color: var(--danger); color: var(--danger); }

        .btn-secondary { background: var(--surface-2); border-color: var(--line-soft); color: var(--text-secondary); }
        .btn-secondary:hover { background: var(--surface-3); color: var(--text); border-color: #CBD5E1; }
        .btn-outline-secondary { background: transparent; border-color: #CBD5E1; color: var(--text-secondary); }
        .btn-outline-secondary:hover { background: var(--surface-2); border-color: var(--text-tertiary); color: var(--text); }
        .btn-link { text-decoration: none; color: var(--text-tertiary); padding-left: 0; padding-right: 0; }
        .btn-link:hover { color: var(--gold); }

        /* ══════════════════════════════════════════
           TABLES
        ══════════════════════════════════════════ */
        .table {
            --bs-table-bg: transparent !important;
            --bs-table-color: #0F172A !important;
            --bs-table-border-color: #E2E8F0 !important;
            margin-bottom: 0;
            color: var(--text) !important;
            border-collapse: separate;
            border-spacing: 0;
        }

        .table > :not(caption) > * > * {
            background-color: transparent !important;
            color: var(--text) !important;
            border-bottom: 1px solid var(--line-soft) !important;
            padding: 0.95rem 1.25rem;
            vertical-align: middle;
            font-size: 0.92rem;
        }

        .table thead th {
            background: #F8FAFC !important;
            color: var(--gold) !important;
            font-family: 'Inter', sans-serif;
            font-size: 0.75rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.18em;
            border-bottom: 2px solid var(--line-soft) !important;
            border-top: none !important;
            padding: 0.95rem 1.25rem;
            white-space: nowrap;
        }

        .table tbody tr {
            transition: background 0.15s var(--ease);
        }

        .table-hover tbody tr:hover > td {
            background-color: rgba(161, 122, 31, 0.05) !important;
            color: var(--text) !important;
        }

        .table-hover tbody tr:hover > td:first-child {
            box-shadow: inset 3px 0 0 var(--gold);
        }

        .table-striped tbody tr:nth-of-type(odd) > td {
            background-color: rgba(241, 245, 249, 0.6) !important;
        }

        .table-responsive {
            border-radius: 0 0 var(--r-lg) var(--r-lg);
            overflow-x: auto;
        }

        /* Form controls inside tables */
        .table .form-control, .table .form-select {
            background-color: #FFFFFF !important;
            border: 1px solid #CBD5E1 !important;
            color: var(--text) !important;
            padding: 0.4rem 0.65rem;
            font-size: 0.88rem;
        }
        .table .form-control:focus, .table .form-select:focus {
            border-color: var(--gold) !important;
            background-color: #FFFFFF !important;
        }

        /* ══════════════════════════════════════════
           BADGES
        ══════════════════════════════════════════ */
        .badge {
            font-family: 'Inter', sans-serif;
            font-size: 0.72rem;
            font-weight: 700;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            padding: 0.4em 0.75em;
            border-radius: 4px;
        }
        .badge.bg-secondary { background: var(--surface-2) !important; color: var(--text-secondary) !important; border: 1px solid var(--line-soft) !important; }
        .badge.bg-success, .badge.bg-success-tint { background: var(--success-tint) !important; color: var(--success) !important; border: 1px solid rgba(22,163,74,0.3) !important; }
        .badge.bg-danger,  .badge.bg-danger-tint  { background: var(--danger-tint) !important;  color: var(--danger) !important;  border: 1px solid rgba(220,38,38,0.3) !important; }
        .badge.bg-warning, .badge.bg-warning-tint { background: var(--warning-tint) !important; color: var(--warning) !important; border: 1px solid rgba(217,119,6,0.3) !important; }
        .badge.bg-info,    .badge.bg-info-tint    { background: var(--info-tint) !important;    color: var(--info) !important;    border: 1px solid rgba(2,132,199,0.3) !important; }
        .badge.bg-gold      { background: var(--gold-tint) !important; color: var(--gold) !important; border: 1px solid rgba(161,122,31,0.3) !important; }
        .badge.bg-light     { background: var(--surface-2) !important; color: var(--text-secondary) !important; border: 1px solid var(--line-soft) !important; }

        /* ══════════════════════════════════════════
           FORM CONTROLS & SELECT DROPDOWNS
        ══════════════════════════════════════════ */
        .form-control, .form-select {
            background-color: #FFFFFF !important;
            border: 1px solid #CBD5E1 !important;
            border-radius: var(--r-sm);
            color: var(--text) !important;
            font-family: 'Inter', sans-serif;
            font-size: 0.92rem;
            padding: 0.65rem 0.95rem;
            transition: border-color 0.2s, box-shadow 0.2s;
        }
        .form-select {
            padding-right: 2.2rem;
            background-image: url("data:image/svg+xml,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3e%3cpath fill='none' stroke='%23A17A1F' stroke-linecap='round' stroke-linejoin='round' stroke-width='2' d='m2 5 6 6 6-6'/%3e%3c/svg%3e") !important;
            background-repeat: no-repeat !important;
            background-position: right 0.75rem center !important;
            background-size: 14px 14px !important;
        }
        .form-control::placeholder { color: var(--text-tertiary); }
        .form-control:focus, .form-select:focus {
            background-color: #FFFFFF !important;
            border-color: var(--gold) !important;
            box-shadow: 0 0 0 3px rgba(161,122,31,0.15) !important;
            color: var(--text) !important;
            outline: none;
        }
        .form-control:hover, .form-select:hover {
            border-color: #94A3B8 !important;
        }
        .form-label {
            font-family: 'Inter', sans-serif;
            font-size: 0.75rem;
            font-weight: 700;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.15em;
            margin-bottom: 0.45rem;
        }
        .form-select option {
            background-color: #FFFFFF !important;
            color: #0F172A !important;
            padding: 0.6rem;
            font-size: 0.92rem;
        }
        .form-check-input {
            background-color: #FFFFFF;
            border-color: #CBD5E1;
        }
        .form-check-input:checked {
            background-color: var(--gold);
            border-color: var(--gold);
        }
        .input-group-text {
            background: #F8FAFC !important;
            border-color: #CBD5E1 !important;
            color: var(--text-secondary) !important;
            font-size: 0.92rem;
        }

        /* ══════════════════════════════════════════
           MODALS & LIST GROUPS
        ══════════════════════════════════════════ */
        .modal-content {
            background: #FFFFFF !important;
            border: 1px solid var(--line-soft) !important;
            border-radius: var(--r-xl) !important;
            box-shadow: var(--shadow-lg);
        }
        .modal-header {
            background: #F8FAFC !important;
            border-bottom: 1px solid var(--line-soft) !important;
            padding: 1.35rem 1.6rem;
        }
        .modal-title {
            font-family: 'Oswald', sans-serif;
            font-size: 1.05rem; font-weight: 600;
            letter-spacing: 0.12em; text-transform: uppercase;
            color: var(--text) !important;
        }
        .modal-footer { border-color: var(--line-soft) !important; }
        .modal-backdrop.show {
            opacity: 0.4;
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
        }

        .list-group-item {
            background: transparent !important;
            border-color: var(--line-soft) !important;
            color: var(--text) !important;
            font-size: 0.9rem;
            font-family: 'Inter', sans-serif;
            padding: 0.75rem 1.25rem;
            transition: background 0.15s;
        }
        .list-group-item:hover { background: #F8FAFC !important; }

        /* ══════════════════════════════════════════
           PRODUCT CARDS (new/edit order)
        ══════════════════════════════════════════ */
        .product-card-col .card {
            cursor: pointer;
            border-color: var(--line-soft) !important;
            background: #FFFFFF !important;
            transition: transform 0.25s var(--ease), box-shadow 0.25s, border-color 0.25s;
        }
        .product-card-col .card:hover {
            transform: translateY(-4px);
            border-color: var(--gold) !important;
            box-shadow: var(--shadow-md), 0 0 0 1px var(--gold-tint) !important;
        }
        .product-card-col .card:active { transform: scale(0.97); }

        /* Focus */
        a:focus-visible, button:focus-visible, .btn:focus-visible {
            outline: 2px solid var(--gold);
            outline-offset: 3px;
        }
    </style>
</head>
<body>

    <!-- ══════════════════════════════════════════
         SIDEBAR
    ══════════════════════════════════════════ -->
    <aside class="sidebar" id="sidebar">
        <a class="sidebar-brand" href="/">
            <div class="sidebar-eyebrow">
                <div class="sidebar-eyebrow-line"></div>
                <span class="sidebar-eyebrow-text">OMS · 2025</span>
            </div>
            <span class="sidebar-brand-name">Salu<span>za</span>'s</span>
            <span class="sidebar-brand-sub">Closet Manager</span>
        </a>

        <nav class="sidebar-nav">
            <span class="sidebar-nav-label">Overview</span>
            <a class="sidebar-link {% if request.path == '/' %}active{% endif %}" href="/">
                <i class="bi bi-grid-1x2-fill"></i> Dashboard
            </a>

            <span class="sidebar-nav-label">Operations</span>
            <a class="sidebar-link {% if request.path == '/new_order' %}active{% endif %}" href="/new_order">
                <i class="bi bi-plus-square-fill"></i> New Order
            </a>
            <a class="sidebar-link {% if request.path == '/orders' %}active{% endif %}" href="/orders">
                <i class="bi bi-journal-text"></i> Order History
            </a>
            <a class="sidebar-link {% if request.path == '/inventory' %}active{% endif %}" href="/inventory">
                <i class="bi bi-boxes"></i> Inventory
            </a>
            <a class="sidebar-link {% if request.path == '/expenses' %}active{% endif %}" href="/expenses">
                <i class="bi bi-receipt-cutoff"></i> Expenses
            </a>
        </nav>

        <div class="sidebar-footer">
            <div class="sidebar-status">
                <div class="status-dot"></div>
                <span>All systems operational</span>
            </div>
        </div>
    </aside>

    <!-- ── MOBILE TOP BAR ── -->
    <div class="topbar" id="topbar">
        <div class="topbar-brand">Salu<span>za</span>'s Closet</div>
        <button class="hamburger-btn" id="hamburgerBtn" aria-label="Menu">
            <i class="bi bi-list"></i>
        </button>
    </div>
    <div class="sidebar-overlay" id="sidebarOverlay"></div>

    <!-- ── MAIN ── -->
    <div class="main-wrapper">
        <div class="main-content page-content">
            {% block content %}{% endblock %}
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        const sidebar   = document.getElementById('sidebar');
        const overlay   = document.getElementById('sidebarOverlay');
        const hamburger = document.getElementById('hamburgerBtn');
        const open  = () => { sidebar.classList.add('open'); overlay.classList.add('active'); };
        const close = () => { sidebar.classList.remove('open'); overlay.classList.remove('active'); };
        if (hamburger) hamburger.addEventListener('click', open);
        if (overlay)   overlay.addEventListener('click', close);
    </script>
</body>
</html>
