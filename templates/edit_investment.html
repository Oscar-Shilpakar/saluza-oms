{% extends "layout.html" %}

{% block content %}
<div class="page-header">
    <div>
        <div class="page-header-eyebrow">
            <div class="page-header-eyebrow-line"></div>
            <span class="page-header-eyebrow-text">Capital Accounting</span>
        </div>
        <h1>Edit Investment <span class="gold">Record</span></h1>
        <p class="page-header-sub">Update capital source or funding allocation entry.</p>
    </div>
    <a href="/" class="btn btn-outline-secondary btn-sm">
        <i class="bi bi-arrow-left me-1"></i>Dashboard
    </a>
</div>

<div class="row justify-content-center">
    <div class="col-md-6 col-lg-5">
        <div class="card">
            <div class="card-header">Investment Details</div>
            <div class="card-body">
                <form action="/edit_investment/{{ investment.id }}" method="POST">
                    <div class="mb-3">
                        <label class="form-label">Amount (Rs)</label>
                        <input type="number" step="0.01" name="amount" class="form-control" value="{{ investment.amount }}" required>
                    </div>
                    <div class="mb-4">
                        <label class="form-label">Note / Source</label>
                        <input type="text" name="note" class="form-control" value="{{ investment.note }}">
                    </div>
                    <div class="d-grid gap-2">
                        <button type="submit" class="btn btn-primary">
                            <i class="bi bi-check-lg me-1"></i>Update Record
                        </button>
                        <a href="/" class="btn btn-outline-secondary">Cancel</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
